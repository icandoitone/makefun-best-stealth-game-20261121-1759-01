<!DOCTYPE html>
<html lang="en">
<head>

<title>Lantern Thief — The Ember Vault</title>
<link rel="stylesheet" href="styles.css">

<body>
<main class="stage">
  <canvas id="game" width="960" height="640"></canvas>
  <p class="help">
    <strong>Lantern Thief — The Ember Vault.</strong>
    Steal the Ember Star on each floor and reach the green EXIT unseen.
    WASD / arrows to move · Shift to sneak · Space to run (loud!) ·
    Q or right-click to toss a pebble · Click to walk there · M to mute · R to retry.
  </p>
</main>
<script type="module" src="src/main.js"></script>
</body>
